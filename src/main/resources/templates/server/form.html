<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Server Form</title>
</head>
<body>

<h2 th:text="${server.id != null} ? 'Edit Server' : 'Add Server'"></h2>

<form th:action="${server.id == null} ? @{/servers} : @{/servers/{id}(id=${server.id})}"
      th:object="${server}" method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required />
    <div th:errors="*{name}" style="color:red"></div>

    <label>Age:</label>
    <input type="number" th:field="*{age}" min="18" required />
    <div th:errors="*{age}" style="color:red"></div>

    <label>Designation:</label>
    <input type="text" th:field="*{designation}" required />
    <div th:errors="*{designation}" style="color:red"></div>

    <label>Rating (1.0 – 5.0):</label>
    <input type="number" step="0.1" min="1.0" max="5.0" th:field="*{rating}" required />
    <div th:errors="*{rating}" style="color:red"></div>

    <button type="submit">Save</button>
</form>

<a th:href="@{/servers}">⬅ Back</a>

</body>
</html>
