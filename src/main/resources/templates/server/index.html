<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Servers</title>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <!--    <h2>Servers</h2>-->

    <a href="/" style="
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
       onmouseover="this.style.background='#2980b9'"
       onmouseout="this.style.background='#3498db'">
        Home
    </a>
</div>
<h2>Servers</h2>

<a href="/servers/new">Add New Server</a>

<!-- 🔍 FILTER FORM -->
<form method="get" style="margin:15px 0;">
    <input type="text" name="designation" placeholder="Filter by Designation"
           th:value="${designation}" />

    <input type="number" name="age" placeholder="Filter by Age"
           th:value="${age}" />

    <input type="text" name="rating" placeholder="Filter by Rating"
           th:value="${rating}" />

    <button type="submit">Filter</button>
    <a href="/servers">Reset</a>
</form>

<table border="1">
    <tr>
        <!-- SORT BY ID -->
        <th>
            <a th:href="@{/servers(
                designation=${designation},
                age=${age},
                rating=${rating},
                sortBy='id',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">ID</a>
        </th>

        <!-- SORT BY NAME -->
        <th>
            <a th:href="@{/servers(
                designation=${designation},
                age=${age},
                rating=${rating},
                sortBy='name',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">Name</a>
        </th>

        <!-- SORT BY DESIGNATION -->
        <th>
            <a th:href="@{/servers(
                designation=${designation},
                age=${age},
                rating=${rating},
                sortBy='designation',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">Designation</a>
        </th>

        <!-- SORT BY RATING -->
        <th>
            <a th:href="@{/servers(
                designation=${designation},
                age=${age},
                rating=${rating},
                sortBy='rating',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">Rating</a>
        </th>

        <th>Actions</th>
    </tr>
    <tr th:each="server : ${servers}">
        <td th:text="${server.id}"></td>
        <td th:text="${server.name}"></td>
        <td th:text="${server.designation}"></td>
        <td th:text="${server.rating}"></td>
        <td>
            <form th:action="@{'/servers/' + ${server.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
