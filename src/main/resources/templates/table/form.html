<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Table</title>
</head>
<body>
<h2>Add New Table</h2>

<form th:action="@{/tables}" th:object="${table}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Number:</label>
    <input type="number" th:field="*{number}" required><br>

    <label>Occupied Status:</label>
    <input type="text" th:field="*{occupiedStatus}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/tables">⬅️ Back to list</a>
</body>
</html>
