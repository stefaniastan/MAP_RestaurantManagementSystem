<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Assignments</title>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <!--    <h2>Order Assignments</h2>-->

    <a href="/" style="
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
       onmouseover="this.style.background='#2980b9'"
       onmouseout="this.style.background='#3498db'">
        Home
    </a>
</div>
<h2>Order Assignments</h2>

<a href="/assignments/new">Add New Assignment</a>

<!-- 🔍 FILTER FORM -->
<form method="get" style="margin:15px 0;">
    <input type="number" name="orderId" placeholder="Filter by Order ID"
           th:value="${orderId}" />

    <input type="number" name="staffId" placeholder="Filter by Staff ID"
           th:value="${staffId}" />

    <button type="submit">Filter</button>
    <a href="/assignments">Reset</a>
</form>

<table border="1">
    <thead>
    <tr>
        <!-- SORT BY ID -->
        <th>
            <a th:href="@{/assignments(
                orderId=${orderId},
                staffId=${staffId},
                sortBy='id',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                ID
            </a>
        </th>

        <!-- SORT BY ORDER ID -->
        <th>
            <a th:href="@{/assignments(
                orderId=${orderId},
                staffId=${staffId},
                sortBy='order',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                Order ID
            </a>
        </th>

        <!-- SORT BY STAFF -->
        <th>
            <a th:href="@{/assignments(
                orderId=${orderId},
                staffId=${staffId},
                sortBy='staff',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                Staff
            </a>
        </th>

        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}"></td>
        <td th:text="${assignment.order.id}"></td>
        <td th:text="${assignment.staff.name}"></td>
        <td>
            <form th:action="@{'/assignments/' + ${assignment.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
            <form th:action="@{'/assignments/' + ${assignment.id} + '/edit'}" method="get" style="display:inline">
                <button type="submit">Edit</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
