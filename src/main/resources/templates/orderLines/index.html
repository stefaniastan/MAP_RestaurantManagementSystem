<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Lines</title>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <!--    <h2>Order Lines</h2>-->

    <a href="/" style="
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
       onmouseover="this.style.background='#2980b9'"
       onmouseout="this.style.background='#3498db'">
        Home
    </a>
</div>
<h2>Order Lines</h2>

<a href="/orderlines/new">Add New Order Line</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Menu Item</th>
        <th>Quantity</th>
        <th>Action</th>
    </tr>
    <tr th:each="line : ${orderLines}">
        <td th:text="${line.id}"></td>
        <td th:text="${line.menuItem.name}"></td> <!-- fixed to display MenuItem name -->
        <td th:text="${line.quantity}"></td>
        <td>
            <a th:href="@{'/orderlines/' + ${line.id} + '/edit'}">
                <button type="button">Edit</button>
            </a>
            <form th:action="@{'/orderlines/' + ${line.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
