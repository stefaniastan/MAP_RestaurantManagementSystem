<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Lines</title>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <!--    <h2>Order Lines</h2>-->

    <a href="/" style="
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
       onmouseover="this.style.background='#2980b9'"
       onmouseout="this.style.background='#3498db'">
        Home
    </a>
</div>
<h2>Order Lines</h2>

<a href="/orderlines/new">Add New Order Line</a>

<!-- 🔍 FILTER FORM -->
<form method="get" style="margin:15px 0;">
    <input type="number" name="orderId" placeholder="Filter by Order ID"
           th:value="${orderId}" />

    <input type="number" name="menuItemId" placeholder="Filter by Menu Item ID"
           th:value="${menuItemId}" />

    <input type="number" name="minQuantity" placeholder="Min Quantity"
           th:value="${minQuantity}" />

    <button type="submit">Filter</button>
    <a href="/orderlines">Reset</a>
</form>

<table border="1">
    <tr>
        <!-- SORT BY ID -->
        <th>
            <a th:href="@{/orderlines(
                orderId=${orderId},
                menuItemId=${menuItemId},
                minQuantity=${minQuantity},
                sortBy='id',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                ID
            </a>
        </th>

        <th>Menu Item</th>

        <!-- SORT BY QUANTITY -->
        <th>
            <a th:href="@{/orderlines(
                orderId=${orderId},
                menuItemId=${menuItemId},
                minQuantity=${minQuantity},
                sortBy='quantity',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                Quantity
            </a>
        </th>

        <th>Action</th>
    </tr>
    <tr th:each="line : ${orderLines}">
        <td th:text="${line.id}"></td>
        <td th:text="${line.menuItem.name}"></td> <!-- fixed to display MenuItem name -->
        <td th:text="${line.quantity}"></td>
        <td>
            <a th:href="@{'/orderlines/' + ${line.id} + '/edit'}">
                <button type="button">Edit</button>
            </a>
            <form th:action="@{'/orderlines/' + ${line.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
