<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Order Line</title>
</head>
<body>
<h2 th:text="${orderLine.id != null} ? 'Edit Order Line' : 'Add New Order Line'"></h2>

<form th:action="@{${orderLine.id} != null ? '/orderlines/' + ${orderLine.id} : '/orderlines'}"
      th:object="${orderLine}" method="post">

    <input type="hidden" th:field="*{id}" />

    <label>Menu Item:</label>
    <select th:field="*{menuItem.id}" required>
        <option th:each="m : ${menuItems}" th:value="${m.id}" th:text="${m.name}"></option>
    </select>
    <div th:if="${#fields.hasErrors('menuItem')}" th:errors="*{menuItem}"></div>

    <label>Order:</label>
    <select th:field="*{order.id}" required>
        <option th:each="o : ${orders}" th:value="${o.id}" th:text="'Order #' + ${o.id}"></option>
    </select>
    <div th:if="${#fields.hasErrors('order')}" th:errors="*{order}"></div>


    <label>Quantity:</label>
    <input type="number" th:field="*{quantity}" step="1" min="1" required />
    <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>

    <button type="submit">Save</button>
</form>

<a th:href="@{/orderLines}">⬅️ Back to list</a>
</body>
</html>
