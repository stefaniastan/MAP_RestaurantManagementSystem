<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Customer</title>
</head>
<body>
<h2>Add New Customer</h2>

<form th:action="@{/customers}" th:object="${customer}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{Id}" required /><br>

    <label>Name:</label>
    <input type="text" th:field="*{Name}" required /><br>

    <label>Address:</label>
    <input type="text" th:field="*{Adress}" required /><br>

    <label>Email:</label>
    <input type="email" th:field="*{Email}" required /><br>

    <button type="submit">Save</button>
</form>

<a href="/customers">⬅️ Back to list</a>
</body>
</html>
