<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create/Edit Customer</title>
</head>
<body>
<h1 th:text="${customer.id != null} ? 'Edit Customer' : 'Create Customer'"></h1>

<form th:action="@{${customer.id != null} ? '/customers/update' : '/customers/save'}" th:object="${customer}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" required maxlength="100" />
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

    <label>Address:</label>
    <input type="text" th:field="*{address}" required maxlength="200" />
    <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required maxlength="100" />
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <button type="submit">Save</button>
</form>
<a th:href="@{/customers}">Back to list</a>
</body>
</html>
