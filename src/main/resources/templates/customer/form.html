<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create/Edit Customer</title>
</head>
<body>
<h1 th:text="${customer.id != null} ? 'Edit Customer' : 'Create Customer'"></h1>

<form th:action="@{${customer.id != null} ? '/customers/' + ${customer.id} : '/customers'}"
      th:object="${customer}"
      method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" required maxlength="100" />
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
         style="color:red;"></div>
    </div>

    <label>Address:</label>
    <input type="text" th:field="*{address}" required maxlength="200" />
    <div th:if="${#fields.hasErrors('address')}"
         th:errors="*{address}"
         style="color:red;"></div>


    <label>Email:</label>
    <input type="email" th:field="*{email}" required maxlength="100" />
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <button type="submit">Save</button>
</form>
<a th:href="@{/customers}">Back to list</a>
</body>
</html>
