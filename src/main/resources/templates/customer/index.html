<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customers</title>
</head>
<body>
<h2>Customers</h2>

<a href="/customers/new">Add New Customer</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Address</th>
        <th>Email</th>
        <th>Orders</th>
        <th>Action</th>
    </tr>
    <tr th:each="customer : ${customers}">
        <td th:text="${customer.Id}"></td>
        <td th:text="${customer.Name}"></td>
        <td th:text="${customer.Adress}"></td>
        <td th:text="${customer.Email}"></td>
        <td th:text="${customer.orders != null ? customer.orders.size() : 0}"></td>
        <td>
            <form th:action="@{'/customers/' + ${customer.Id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
