<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restaurant Management System</title>

    <!-- Simple styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .menu-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .menu-item {
            background: white;
            padding: 0; /* remove padding here */
            width: 220px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s;
            overflow: hidden; /* ensures rounded corners apply to link */
        }

        .menu-item:hover {
            background: #eaeaea;
            transform: translateY(-5px);
        }

        .menu-item a {
            display: block;          /* make link fill the box */
            padding: 25px;           /* move padding here */
            text-decoration: none;
            color: #333;
            font-size: 20px;
            font-weight: bold;
        }
    </style>

</head>

<body>

<h1>Restaurant Management System</h1>

<div class="menu-container">

    <div class="menu-item"><a href="/bill">🧾 Bills</a></div>
    <div class="menu-item"><a href="/chefs">👨‍🍳 Chefs</a></div>
    <div class="menu-item"><a href="/customers">🧍 Customers</a></div>
    <div class="menu-item"><a href="/menuitems">📋 Menu Items</a></div>
    <div class="menu-item"><a href="/orders">🛒 Orders</a></div>
    <div class="menu-item"><a href="/assignments">📤Ord. Assign.</a></div>
    <div class="menu-item"><a href="/orderlines">📦 Order Lines</a></div>
    <div class="menu-item"><a href="/servers">🧑‍💼 Servers</a></div>
    <div class="menu-item"><a href="/tables">🍽 Tables</a></div>

</div>

</body>
</html>
