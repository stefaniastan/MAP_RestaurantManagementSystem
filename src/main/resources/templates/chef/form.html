<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Chef</title>
</head>
<body>
<h2>Add New Chef</h2>

<form th:action="@{/chefs}" th:object="${chef}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br>

    <label>Rating:</label>
    <input type="text" th:field="*{rating}" required><br>

    <label>Specialization:</label>
    <input type="text" th:field="*{specialization}" required><br>

    <label>Age:</label>
    <input type="number" th:field="*{age}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/chefs">⬅️ Back to list</a>
</body>
</html>
