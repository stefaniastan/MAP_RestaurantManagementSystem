<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders</title>
</head>
<body>
<h2>All Orders</h2>
<a href="/" style="
        margin-right: 220px;
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
   onmouseover="this.style.background='#2980b9'"
   onmouseout="this.style.background='#3498db'">
    Home
</a>

<a th:href="@{/orders/new}">➕ Add New Order</a>

<!-- 🔍 FILTER FORM -->
<form method="get" style="margin:15px 0;">
    <input type="number" name="customerId" placeholder="Filter by Customer ID"
           th:value="${customerId}" />

    <input type="number" name="tableId" placeholder="Filter by Table ID"
           th:value="${tableId}" />

    <select name="status">
        <option value="">-- Filter by Status --</option>
        <option th:each="st : ${allStatuses}"
                th:value="${st}"
                th:text="${st}"
                th:selected="${st == status}">
        </option>
    </select>

    <button type="submit">Filter</button>
    <a href="/orders">Reset</a>
</form>
<br><br>

<table border="1">
    <tr>
        <!-- SORT BY ID -->
        <th>
            <a th:href="@{/orders(
                customerId=${customerId},
                tableId=${tableId},
                status=${status},
                sortBy='id',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                ID
            </a>
        </th>

        <th>Customer</th>

        <th>Table</th>

        <!-- SORT BY STATUS -->
        <th>
            <a th:href="@{/orders(
                customerId=${customerId},
                tableId=${tableId},
                status=${status},
                sortBy='status',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                Status
            </a>
        </th>

        <th>Actions</th>
    </tr>

    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>

        <td th:text="${order.customer != null} ? ${order.customer.name} + ' (ID: ' + ${order.customer.id} + ')' : 'No Customer'"></td>

        <td th:text="${order.table != null} ? 'Table ' + ${order.table.id} : 'No Table'"></td>

        <td th:text="${order.status}"></td>
        <td>
            <form th:action="@{/orders/{id}/delete(id=${order.id})}" method="post">
                <button type="submit">🗑️ Delete</button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
