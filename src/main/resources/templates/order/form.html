<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${order.id != null} ? 'Edit Order' : 'Add New Order'">Order Form</title>
</head>
<body>

<h2 th:text="${order.id != null} ? 'Edit Order' : 'Add New Order'"></h2>

<form th:action="${order.id == null} ? @{/orders} : @{/orders/{id}(id=${order.id})}"
      th:object="${order}"
      method="post">

    <input type="hidden" th:field="*{id}" />

    <label>Customer:</label><br>
    <select th:field="*{customer}" required>
        <option th:each="c : ${customers}"
                th:value="${c.id}"
                th:text="${c.name} + ' (ID: ' + ${c.id} + ')'">
        </option>
    </select>
    <div style="color:red" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>
    <br><br>

    <label>Table:</label><br>
    <select th:field="*{table}" required>
        <option th:each="t : ${tables}"
                th:value="${t.id}"
                th:text="'Table ' + ${t.id}">
        </option>
    </select>
    <div style="color:red" th:if="${#fields.hasErrors('table')}" th:errors="*{table}"></div>
    <br><br>

    <label>Status:</label><br>
    <select th:field="*{status}">
        <option value="NEW">New</option>
        <option value="COOKING">Cooking</option>
        <option value="READY">Ready</option>
        <option value="SERVED">Served</option>
        <option value="PAID">Paid</option>
    </select>
    <div style="color:red" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
    <br><br>

    <button type="submit">Save Order</button>
</form>

<br>
<a th:href="@{/orders}">⬅️ Back to list</a>
</body>
</html>
