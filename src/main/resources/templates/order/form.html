<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Order</title>
</head>
<body>
<h2 th:text="${order.id != null} ? 'Edit Order' : 'Add New Order'"></h2>

<form th:action="@{${order.id != null} ? '/orders/update' : '/orders/save'}" th:object="${order}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Customer:</label>
    <select th:field="*{customer}" required>
        <option th:each="c : ${customers}" th:value="${c}" th:text="${c.name}"></option>
    </select>
    <div th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>

    <label>Table:</label>
    <select th:field="*{table}" required>
        <option th:each="t : ${tables}" th:value="${t}" th:text="${t.number}"></option>
    </select>
    <div th:if="${#fields.hasErrors('table')}" th:errors="*{table}"></div>

    <label>Status:</label>
    <input type="text" th:field="*{status}" required maxlength="50" />
    <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>

    <button type="submit">Save</button>
</form>

<a th:href="@{/orders}">⬅️ Back to list</a>
</body>
</html>
