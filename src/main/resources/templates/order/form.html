<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Order</title>
</head>
<body>
<h2>Add New Order</h2>

<form th:action="@{/orders}" th:object="${order}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Customer ID:</label>
    <input type="text" th:field="*{customerId}" required><br>

    <label>Table ID:</label>
    <input type="text" th:field="*{tableId}" required><br>

    <label>Status:</label>
    <input type="text" th:field="*{status}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/orders">⬅️ Back to list</a>
</body>
</html>
