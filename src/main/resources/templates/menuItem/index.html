<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menu Items</title>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <!--    <h2>Menu Items</h2>-->

    <a href="/" style="
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
       onmouseover="this.style.background='#2980b9'"
       onmouseout="this.style.background='#3498db'">
        Home
    </a>
</div>
<h2>Menu Items</h2>

<a href="/menuitems/new">Add New Item</a>

<!-- 🔍 FILTER FORM -->
<form method="get" style="margin:15px 0;">
    <input type="text" name="name" placeholder="Filter by Name"
           th:value="${name}" />

    <input type="number" step="0.01" name="minPrice"
           placeholder="Min Price"
           th:value="${minPrice}" />

    <input type="number" step="0.01" name="maxPrice"
           placeholder="Max Price"
           th:value="${maxPrice}" />

    <button type="submit">Filter</button>
    <a href="/menuitems">Reset</a>
</form>

<table border="1">
    <tr>
        <!-- SORT BY ID -->
        <th>
            <a th:href="@{/menuitems(
                name=${name},
                minPrice=${minPrice},
                maxPrice=${maxPrice},
                sortBy='id',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                ID
            </a>
        </th>

        <!-- SORT BY NAME -->
        <th>
            <a th:href="@{/menuitems(
                name=${name},
                minPrice=${minPrice},
                maxPrice=${maxPrice},
                sortBy='name',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                Name
            </a>
        </th>

        <!-- SORT BY PRICE -->
        <th>
            <a th:href="@{/menuitems(
                name=${name},
                minPrice=${minPrice},
                maxPrice=${maxPrice},
                sortBy='price',
                direction=${direction == 'asc' ? 'desc' : 'asc'}
            )}">
                Price
            </a>
        </th>

        <th>Action</th>
    </tr>
    <tr th:each="item : ${menuItems}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.price}"></td>
        <td>
            <form th:action="@{/menuitems/{id}/delete(id=${item.id})}" method="post">
                <button type="submit">Delete</button>
            </form>

        </td>
    </tr>
</table>
</body>
</html>
