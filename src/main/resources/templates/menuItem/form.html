<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Menu Item</title>
</head>
<body>
<h2>Add New Menu Item</h2>

<form th:action="@{/menuItems}" th:object="${menuItem}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Name:</label>
    <input type="text" th:field="*{name}" required><br>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{price}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/menuItems">⬅️ Back to list</a>
</body>
</html>
