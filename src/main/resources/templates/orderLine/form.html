<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Order Line</title>
</head>
<body>
<h2>Add New Order Line</h2>

<form th:action="@{/orderLines}" th:object="${orderLine}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Menu Item ID:</label>
    <input type="text" th:field="*{menuItemId}" required><br>

    <label>Quantity:</label>
    <input type="number" step="0.01" th:field="*{quantity}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/orderLines">⬅️ Back to list</a>
</body>
</html>
