<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Order Assignment</title>
</head>
<body>
<h2>Add New Order Assignment</h2>

<form th:action="@{/orderAssignments}" th:object="${orderAssignment}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Order ID:</label>
    <input type="text" th:field="*{orderId}" required><br>

    <label>Staff ID:</label>
    <input type="text" th:field="*{staffId}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/orderAssignments">⬅️ Back to list</a>
</body>
</html>
