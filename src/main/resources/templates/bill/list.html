<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bills</title>
</head>
<body>
<h1>Bills</h1>
<a th:href="@{/bills/new}">Create New Bill</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Total Amount</th>
        <th>Actions</th>
    </tr>
    <tr th:each="bill : ${bills}">
        <td th:text="${bill.id}"></td>
        <td th:text="${bill.order.id}"></td>
        <td th:text="${bill.totalAmount}"></td>
        <td>
            <a th:href="@{/bills/edit/{id}(id=${bill.id})}">Edit</a>
            <a th:href="@{/bills/delete/{id}(id=${bill.id})}"
               onclick="return confirm('Are you sure?');">Delete</a>
        </td>
    </tr>
</table>
</body>
</html>
