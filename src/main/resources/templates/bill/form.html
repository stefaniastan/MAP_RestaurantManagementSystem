<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Bill</title>
</head>
<body>
<h2>Add New Bill</h2>

<form th:action="@{/bills}" th:object="${bill}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" required><br>

    <label>Order ID:</label>
    <input type="text" th:field="*{orderId}" required><br>

    <label>Total Amount:</label>
    <input type="number" step="0.01" th:field="*{totalAmount}" required><br>

    <button type="submit">Save</button>
</form>

<a href="/bills">⬅️ Back to list</a>
</body>
</html>
