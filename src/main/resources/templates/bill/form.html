<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create/Edit Bill</title>
</head>
<body>
<h1 th:text="${bill.id != null} ? 'Edit Bill' : 'Create Bill'"></h1>

<form th:action="@{${bill.id != null} ? '/bills/update' : '/bills/save'}" th:object="${bill}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Order:</label>
    <select th:field="*{order}" required>
        <option th:each="order : ${orders}" th:value="${order}" th:text="${order.id}">Order ID</option>
    </select>
    <div th:if="${#fields.hasErrors('order')}" th:errors="*{order}"></div>

    <label>Total Amount:</label>
    <input type="number" th:field="*{totalAmount}" step="0.01" required />
    <div th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}"></div>

    <button type="submit">Save</button>
</form>
<a th:href="@{/bills}">Back to list</a>
</body>
</html>
