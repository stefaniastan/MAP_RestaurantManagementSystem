<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create/Edit Bill</title>
</head>
<body>
<h1 th:text="${bill.id != null} ? 'Edit Bill' : 'Create Bill'"></h1>

<form th:action="@{${bill.id != null} ? '/bill/' + ${bill.id} : '/bill'}" th:object="${bill}" method="post">    <input type="hidden" th:field="*{id}" />
    <div th:if="${errorMessage}" style="color: red;">
        <p th:text="${errorMessage}"></p>
    </div>
    <label>Order:</label>
    <select name="order" required>
        <option value="">-- Select Order --</option>
        <option th:each="order : ${orders}"
                th:value="${order.id}"
                th:text="${order.id}"
                th:selected="${bill.order != null and bill.order.id == order.id}">Order ID</option>
    </select>
    <div th:if="${#fields.hasErrors('order')}" th:errors="*{order}"></div>

    <label>Total Amount:</label>
    <input type="number" th:field="*{totalAmount}" step="0.01" required />
    <div th:if="${#fields.hasErrors('totalAmount')}" th:errors="*{totalAmount}"></div>

    <button type="submit">Save</button>
</form>
<a th:href="@{/bill}">Back to list</a>
</body>
</html>
