<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bills</title>
</head>
<body>
<h2>Bills</h2>

<a th:href="@{/bill/new}">Add New Bill</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Total Amount</th>
        <th>Action</th>
    </tr>
    <tr th:each="bill : ${bills}">
        <td th:text="${bill.id}"></td>

        <td th:text="${bill.order != null} ? ${bill.order.id} : 'No Order'"></td>

        <td th:text="${bill.totalAmount}"></td>
        <td>
            <form th:action="@{/bill/{id}/delete(id=${bill.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
