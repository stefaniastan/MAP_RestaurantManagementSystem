<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bills</title>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2>Bills</h2>

    <a href="/" style="
        margin-right: 1130px;
        padding:8px 16px;
        background:#3498db;
        color:white;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
        font-family:Arial;
        transition:0.2s;
    "
       onmouseover="this.style.background='#2980b9'"
       onmouseout="this.style.background='#3498db'">
        Home
    </a>
</div>


<a th:href="@{/bill/new}">Add New Bill</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Total Amount</th>
        <th>Action</th>
    </tr>
    <tr th:each="bill : ${bills}">
        <td th:text="${bill.id}"></td>

        <td th:text="${bill.order != null} ? ${bill.order.id} : 'No Order'"></td>

        <td th:text="${bill.totalAmount}"></td>
        <td>
            <form th:action="@{/bill/{id}/delete(id=${bill.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
